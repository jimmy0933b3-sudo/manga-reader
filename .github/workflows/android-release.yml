name: Android CI and Latest Signed Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manga-reader-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run local unit tests
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Restore the fixed Release signing keystore
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error title=Missing signing secret::Set Actions secret ${secret} before publishing."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/manga-reader-release.keystore"
          chmod 600 "$RUNNER_TEMP/manga-reader-release.keystore"
          test -s "$RUNNER_TEMP/manga-reader-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/manga-reader-release.keystore" \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 || {
              echo "::error::Signing key alias, format or password is invalid."
              exit 1
            }

      - name: Build signed Release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/manga-reader-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -PciVersionCode="$((GITHUB_RUN_NUMBER + 1))" \
            -PciVersionName="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          apk="dist/MangaReader-v1.0.${GITHUB_RUN_NUMBER}-signed.apk"
          cp "app/build/outputs/apk/release/app-release.apk" "$apk"
          test -s "$apk"

          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signing-verification.txt"
          expected="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | sha256sum | awk '{print $1}')"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            "$RUNNER_TEMP/signing-verification.txt" | head -n 1)"
          if [[ -z "$actual" || "${actual,,}" != "${expected,,}" ]]; then
            echo "::error::APK signing certificate does not match the Actions keystore."
            exit 1
          fi

          badge="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk")"
          grep -q "package: name='com.mangareader.app' versionCode='$((GITHUB_RUN_NUMBER + 1))'" <<< "$badge"
          (cd dist && sha256sum "MangaReader-v1.0.${GITHUB_RUN_NUMBER}-signed.apk" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish newest Release, then delete older Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists. Skipping this superseded Release."
            exit 0
          fi

          tag="v1.0.${GITHUB_RUN_NUMBER}"
          apk="dist/MangaReader-${tag}-signed.apk"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "$apk" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Manga Reader ${tag} | Latest signed APK" \
              --notes "Automatically built from main after Android compilation and unit tests. Signed using the fixed GitHub Actions keystore. APK: ${apk}. SHA-256: see SHA256SUMS.txt."
          fi

          published_assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          grep -Fxq "MangaReader-${tag}-signed.apk" <<< "$published_assets"
          grep -Fxq "SHA256SUMS.txt" <<< "$published_assets"

          # Preserve the previous release until the replacement APK is confirmed.
          old_tags="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" --jq '.[].tag_name')"
          while IFS= read -r old_tag; do
            [[ -z "$old_tag" || "$old_tag" == "$tag" ]] && continue
            gh release delete "$old_tag" --yes --cleanup-tag
          done <<< "$old_tags"
          gh release view "$tag" --json url,assets --jq '{url,assets:[.assets[].name]}'

      - name: Remove temporary signing keystore
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/manga-reader-release.keystore"
